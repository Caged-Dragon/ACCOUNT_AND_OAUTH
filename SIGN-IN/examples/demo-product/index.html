<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Caged Dragon OAuth Demo Product</title>
  <style>
    :root{color-scheme:light dark;font:16px system-ui,sans-serif}body{max-width:46rem;margin:3rem auto;padding:0 1rem;line-height:1.55}button{font:inherit;font-weight:650;padding:.75rem 1.1rem;border:0;border-radius:.7rem;background:#e3b010;color:#171717;cursor:pointer}button:disabled{opacity:.55;cursor:wait}pre{overflow:auto;white-space:pre-wrap;overflow-wrap:anywhere;padding:1rem;border-radius:.75rem;background:color-mix(in srgb,currentColor 8%,transparent)}.fine{opacity:.72;font-size:.92rem}#message{min-height:1.5rem}
  </style>
</head>
<body>
  <h1>OAuth demo product</h1>
  <p>This sample product uses Caged Dragon OpenID Connect with authorization code + PKCE. It is a browser-only learning demo; use the server-side BFF example for production websites.</p>
  <p><button id="signIn" type="button">Sign in with Caged Dragon</button> <button id="refresh" type="button" hidden>Refresh session</button> <button id="signOut" type="button" hidden>Sign out of this product</button></p>
  <p id="message" role="status" aria-live="polite"></p>
  <h2>Account returned by Caged Dragon</h2>
  <pre id="result">You are not signed in.</pre>
  <script src="__LOGIN_URL__/sdk.js"
    data-auth-url="__OIDC_ISSUER__"
    data-client-id="__CLIENT_ID__"
    data-redirect-uri="http://localhost:5555/auth/callback"></script>
  <script>
    const $ = id => document.getElementById(id);
    const show = session => {
      $('result').textContent = session ? JSON.stringify({
        id: session.user.id,
        email: session.user.email || null,
        email_verified: session.user.email_verified === true,
        name: session.user.user_metadata?.full_name || null,
        expires_at: new Date(session.expiresAt).toISOString()
      }, null, 2) : 'You are not signed in.';
      $('refresh').hidden = !session;
      $('signOut').hidden = !session;
    };
    const message = text => { $('message').textContent = text || ''; };
    $('signIn').onclick = async () => {
      $('signIn').disabled = true;
      try { await CagedDragon.signIn(); }
      catch (e) { message(e.message); $('signIn').disabled = false; }
    };
    $('refresh').onclick = async () => {
      try { show(await CagedDragon.refreshSession()); message('Session refreshed.'); }
      catch (e) { show(null); message(e.message); }
    };
    $('signOut').onclick = async () => {
      await CagedDragon.signOut(); show(null); message('Signed out of this product. The central Caged Dragon session remains active.');
    };
    CagedDragon.complete().then(session => {
      if (session) { show(CagedDragon.getSession()); message('Signed in successfully.'); }
      else show(CagedDragon.getSession());
    }).catch(e => { show(null); message(e.message); });
  </script>
</body>
</html>
