<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo Product</title>
<style>body{font:16px system-ui,sans-serif;max-width:720px;margin:40px auto;padding:0 16px;color:#141414}button{font:inherit;padding:10px 16px;margin:4px 6px 4px 0;border:0;border-radius:8px;background:#E3B010;font-weight:600;cursor:pointer}button.alt{background:#141414;color:#F2C230}pre{background:#f4efdc;padding:14px;border-radius:10px;overflow:auto;white-space:pre-wrap;word-break:break-word}</style>
</head><body>
<h1>Demo Product</h1>
<p>A pretend product that uses Caged Dragon Sign-In. Try each button.</p>
<p>
  <button id="user">Sign in as a user</button>
  <button id="dev" class="alt">Sign in as a developer</button>
  <button id="mfa">Sign in (require two-step)</button>
  <button id="silent">Silent sign-in (no tap if already signed in)</button>
  <button id="out" class="alt">Sign out everywhere</button>
</p>
<h2>What this product received</h2>
<pre id="result">Nothing yet. Press a button.</pre>
<script src="__LOGIN_URL__/sdk.js"></script>
<script>
  const show = o => document.getElementById('result').textContent = typeof o === 'string' ? o : JSON.stringify(o, null, 2);
  const decode = t => JSON.parse(atob(t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
  document.getElementById('user').onclick = () => CagedDragon.signIn({ role: 'user' });
  document.getElementById('dev').onclick = () => CagedDragon.signIn({ role: 'developer' });
  document.getElementById('mfa').onclick = () => CagedDragon.signIn({ role: 'user', requireMfa: true });
  document.getElementById('silent').onclick = () => CagedDragon.signIn({ silent: true });
  document.getElementById('out').onclick = () => CagedDragon.signOut(null);
  CagedDragon.complete().then(s => {
    if (!s) return;
    // A real product would send s.id_token to ITS server and verify it (docs/verify-id-token.mjs).
    show({ role: s.role, roles: s.roles, mfa_verified: s.mfa_verified, mfa_enrolled: s.mfa_enrolled, id_token_claims: decode(s.id_token), has_session_tokens: !!(s.access_token && s.refresh_token) });
  }).catch(e => show('Error: ' + e.message));
</script></body></html>
